services:
  - type: web
    name: ADS
    env: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/ads-admin-0.0.1-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@adscompany.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: AdminPass123!
      - key: ADMIN_DEFAULT_USERNAME
        value: admin
      - key: ADMIN_DEFAULT_FULLNAME
        value: System Administrator

databases:
  - name: ADS-postgres
    plan: free
