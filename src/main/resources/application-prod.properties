# Production Profile - PostgreSQL Database Configuration ONLY
# This profile activates when deploying to production environments

# PostgreSQL Database Configuration for Production
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Production Connection Pool settings for PostgreSQL
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# Disable H2 console completely in production
spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Production logging
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.root=WARN
logging.level.com.ads.admin=INFO

# Static resource handling for production
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Admin Configuration for production
admin.default.email=${ADMIN_DEFAULT_EMAIL:admin@gmail.com}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:Diwakar@123!}
admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.fullname=${ADMIN_DEFAULT_FULLNAME:System Administrator}

# Production optimizations
spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
