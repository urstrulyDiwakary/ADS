# Spring Boot Configuration
spring.application.name=ADS Service
server.port=${PORT:8089}

# Session Configuration - Production ready
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.session.store-type=none

# PostgreSQL Database Configuration - Environment-based
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ADS}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for PostgreSQL - Production optimized
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Database connection validation and error handling
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.test-while-idle=true
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=ADS-HikariPool

# Connection Pool Configuration (HikariCP) - Production optimized with better timeout handling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# Additional connection reliability settings
spring.datasource.hikari.initialization-fail-timeout=10000
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.connection.autocommit=true

# Database initialization - Production safe
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=false
spring.datasource.continue-on-error=false

# Logging Configuration - Production levels
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.ads.service=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

# Admin Configuration - Secure defaults
admin.default.email=${ADMIN_DEFAULT_EMAIL:admin@gmail.com}
admin.default.password=${ADMIN_DEFAULT_PASSWORD:admin123}
admin.default.username=${ADMIN_DEFAULT_USERNAME:admin}
admin.default.fullname=${ADMIN_DEFAULT_FULLNAME:Administrator}

# Thymeleaf Configuration - Production optimized
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true
spring.thymeleaf.enabled=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Production Security Headers
server.servlet.session.cookie.max-age=1800
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Actuator Configuration for Production Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=10MB
management.endpoints.web.base-path=/actuator
